<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Vidlyra</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Poppins, sans-serif;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
}

header {
    height: 70px;
    padding: 0 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: #111;
    border-bottom: 1px solid #252525;
}

.logo {
    color: #ff7a00;
    font-size: 25px;
    font-weight: 700;
}

.back-btn {
    padding: 9px 16px;
    background: transparent;
    border: 1px solid #333;
    border-radius: 8px;
    color: #ccc;
    cursor: pointer;
}

.back-btn:hover {
    border-color: #ff7a00;
    color: #ff7a00;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: 40px auto;
    padding: 0 20px;
}

.title {
    font-size: 30px;
}

.subtitle {
    color: #777;
    margin-top: 5px;
    margin-bottom: 25px;
}

.actions {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 15px;
}

.read-btn {
    background: #151515;
    color: #ff7a00;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
}

.read-btn:hover {
    border-color: #ff7a00;
}

.notification-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.notification {
    position: relative;

    background: #111;
    border: 1px solid #242424;
    border-radius: 14px;

    padding: 18px;

    transition: .2s;
}

.notification:hover {
    border-color: #ff7a00;
}

.notification.unread {
    border-left: 3px solid #ff7a00;
    background: #141414;
}

.notification-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.notification-title {
    font-size: 16px;
    font-weight: 600;
}

.notification-message {
    color: #aaa;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 7px;
}

.notification-time {
    color: #666;
    font-size: 11px;
    white-space: nowrap;
}

.notification-type {
    display: inline-block;

    margin-top: 10px;

    padding: 3px 8px;

    border-radius: 20px;

    background: #222;

    color: #ff7a00;

    font-size: 10px;
    text-transform: uppercase;
}

.empty {
    text-align: center;
    padding: 70px 20px;
    color: #666;
}

.loading {
    text-align: center;
    padding: 60px;
    color: #777;
}

.error {
    text-align: center;
    padding: 30px;
    color: #ff5555;
}

@media(max-width:600px) {

    header {
        padding: 0 18px;
    }

    .container {
        margin-top: 25px;
    }

    .title {
        font-size: 25px;
    }

    .notification-top {
        flex-direction: column;
        gap: 5px;
    }

    .notification-time {
        white-space: normal;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        VIDLYRA
    </div>

    <button
        class="back-btn"
        onclick="window.location.href='profile.html'"
    >
        ← Profile
    </button>

</header>


<main class="container">

    <h1 class="title">
        🔔 Notifications
    </h1>

    <p class="subtitle">
        Your latest Vidlyra updates
    </p>


    <div class="actions">

        <button
            class="read-btn"
            id="readAllButton"
        >
            Mark all as read
        </button>

    </div>


    <div
        id="loading"
        class="loading"
    >
        Loading notifications...
    </div>


    <div
        id="notificationList"
        class="notification-list"
        style="display:none;"
    ></div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/notifications.js"></script>

</body>
</html>
