<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notifications | Vidlyra</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Poppins, sans-serif;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
}

header {
    height: 70px;
    padding: 0 7%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #111;
    border-bottom: 1px solid #252525;
}

.logo {
    color: #ff7a00;
    font-size: 25px;
    font-weight: 700;
}

.back-btn,
.read-all {
    padding: 9px 16px;

    background: transparent;
    border: 1px solid #333;
    border-radius: 8px;

    color: #ccc;
    cursor: pointer;

    transition: .2s;
}

.back-btn:hover,
.read-all:hover {
    border-color: #ff7a00;
    color: #ff7a00;
}

.container {
    width: 100%;
    max-width: 850px;

    margin: 45px auto;
    padding: 0 20px;
}

.page-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
}

.page-title {
    font-size: 30px;
}

.page-subtitle {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

#loading {
    text-align: center;
    color: #888;
    padding: 50px 10px;
}

#notificationList {
    display: none;
    flex-direction: column;
    gap: 12px;
}

.notification {
    padding: 20px;

    background: #111;

    border: 1px solid #292929;

    border-radius: 14px;

    cursor: pointer;

    transition: .2s;
}

.notification:hover {
    border-color: #ff7a00;
    transform: translateY(-2px);
}

.notification.unread {
    border-left: 3px solid #ff7a00;
    background: #14100d;
}

.notification-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}

.notification-title {
    color: #ff7a00;
    font-size: 16px;
    font-weight: 600;
}

.notification-message {
    color: #bbb;
    font-size: 13px;
    line-height: 1.7;
    margin-top: 7px;
}

.notification-time {
    color: #666;
    font-size: 11px;
    white-space: nowrap;
}

.notification-type {
    display: inline-block;

    margin-top: 12px;

    padding: 4px 9px;

    border-radius: 20px;

    background: #1d1d1d;

    color: #777;

    font-size: 10px;
}

.empty,
.error {
    padding: 50px 20px;

    text-align: center;

    background: #111;

    border: 1px solid #292929;

    border-radius: 14px;

    color: #888;
}

.error {
    color: #ff7777;
}

@media(max-width:600px) {

    header {
        padding: 0 18px;
    }

    .page-top {
        align-items: flex-start;
        flex-direction: column;
    }

    .page-title {
        font-size: 25px;
    }

    .notification-top {
        flex-direction: column;
        gap: 8px;
    }

    .notification-time {
        order: -1;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        VIDLYRA
    </div>

    <button
        class="back-btn"
        onclick="window.location.href='profile.html'"
    >
        ← Profile
    </button>

</header>


<main class="container">

    <div class="page-top">

        <div>

            <h1 class="page-title">
                Notifications
            </h1>

            <p class="page-subtitle">
                Your latest Vidlyra updates
            </p>

        </div>


        <button
            id="readAllButton"
            class="read-all"
            type="button"
        >
            Mark all as read
        </button>

    </div>


    <div id="loading">
        Loading notifications...
    </div>


    <div id="notificationList"></div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

<script src="js/notifications.js"></script>

</body>

</html>
