<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>My Projects | Vidlyra Creator Portal</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Poppins, sans-serif;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
}


/* HEADER */

header {
    height: 70px;
    padding: 0 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #111;
    border-bottom: 1px solid #252525;
}

.logo {
    color: #ff7a00;
    font-size: 25px;
    font-weight: 700;
}

.back-btn {
    padding: 9px 16px;

    background: transparent;
    border: 1px solid #333;
    border-radius: 8px;

    color: #ccc;
    cursor: pointer;
}

.back-btn:hover {
    border-color: #ff7a00;
    color: #ff7a00;
}


/* CONTAINER */

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.title {
    font-size: 30px;
}

.subtitle {
    color: #888;
    margin-top: 5px;
}


/* UPLOAD BUTTON */

.upload-btn {
    display: inline-block;

    margin-top: 20px;

    padding: 12px 20px;

    background: #ff7a00;

    color: white;

    text-decoration: none;

    border-radius: 9px;

    font-weight: 600;
}

.upload-btn:hover {
    background: #ff9500;
}


/* PROJECT GRID */

.projects-grid {

    margin-top: 35px;

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(260px, 1fr));

    gap: 20px;
}


/* PROJECT CARD */

.project-card {

    background: #111;

    border: 1px solid #292929;

    border-radius: 15px;

    overflow: hidden;

    transition: .2s;

}

.project-card:hover {

    border-color: #ff7a00;

    transform: translateY(-3px);

}


/* THUMBNAIL */

.thumbnail {

    width: 100%;

    height: 170px;

    background: #1a1a1a;

    object-fit: cover;

}


/* CARD CONTENT */

.card-content {
    padding: 18px;
}

.project-title {
    font-size: 18px;
    font-weight: 600;
}

.category {
    margin-top: 5px;
    color: #ff7a00;
    font-size: 13px;
}


/* STATUS */

.status {

    display: inline-block;

    margin-top: 12px;

    padding: 5px 10px;

    border-radius: 20px;

    background: #1d1d1d;

    color: #aaa;

    font-size: 12px;

}


/* DESCRIPTION */

.description {

    margin-top: 12px;

    color: #888;

    font-size: 13px;

    line-height: 1.5;

}


/* EMPTY */

.empty {

    margin-top: 50px;

    text-align: center;

    color: #777;

}


/* LOADING */

.loading {

    margin-top: 50px;

    text-align: center;

    color: #888;

}


/* ERROR */

.error {

    margin-top: 30px;

    text-align: center;

    color: #ff5555;

}


/* MOBILE */

@media(max-width:600px) {

    header {
        padding: 0 18px;
    }

    .title {
        font-size: 25px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        VIDLYRA
    </div>

    <button
        class="back-btn"
        onclick="window.location.href='dashboard.html'"
    >
        ← Dashboard
    </button>

</header>


<main class="container">


    <h1 class="title">
        My Projects
    </h1>

    <p class="subtitle">
        Manage your Vidlyra creator submissions.
    </p>


    <a
        href="upload.html"
        class="upload-btn"
    >
        + Upload New Project
    </a>


    <div
        id="loading"
        class="loading"
    >
        Loading projects...
    </div>


    <div
        id="projectsGrid"
        class="projects-grid"
    ></div>


    <div
        id="empty"
        class="empty"
        style="display:none;"
    >

        You haven't uploaded any projects yet.

        <br>

        Click
        <b>Upload New Project</b>
        to get started.

    </div>


    <div
        id="error"
        class="error"
    ></div>


</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

<script src="js/projects.js"></script>


</body>

</html>
