```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Anime | Vidlyra</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #070707;
            color: white;
        }

        header {
            height: 70px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #252525;
        }

        .logo {
            color: #ff7a00;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #ff7a00;
        }

        .hero {
            width: min(1200px, 94%);
            margin: 35px auto;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .hero p {
            color: #888;
        }

        .filters {
            width: min(1200px, 94%);
            margin: 0 auto 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 220px;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #303030;
            background: #111;
            color: white;
            outline: none;
        }

        .filter {
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #303030;
            background: #111;
            color: white;
        }

        .projects {
            width: min(1200px, 94%);
            margin: auto;
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding-bottom: 60px;
        }

        .card {
            background: #111;
            border: 1px solid #282828;
            border-radius: 15px;
            overflow: hidden;
            transition: transform .2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .poster {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background: #1b1b1b;
        }

        .card-body {
            padding: 16px;
        }

        .title {
            font-size: 18px;
            margin-bottom: 7px;
        }

        .category {
            color: #ff8b2b;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .creator {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 12px;
        }

        .creator-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
        }

        .creator-name {
            color: #bbb;
            font-size: 13px;
        }

        .creator-level {
            color: #777;
            font-size: 11px;
        }

        .view-profile {
            display: block;
            margin-top: 14px;
            color: #ff8b2b;
            text-decoration: none;
            font-size: 12px;
        }

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .error {
            color: #ff6262;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        VIDLYRA
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="projects.html">
            Anime
        </a>

    </nav>

</header>


<section class="hero">

    <h1>
        Anime
    </h1>

    <p>
        Discover approved creations from Vidlyra creators.
    </p>

</section>


<section class="filters">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="Search anime..."
    >

    <select
        id="category"
        class="filter"
    >

        <option value="all">
            All Categories
        </option>

        <option value="Anime">
            Anime
        </option>

        <option value="Short Film">
            Short Film
        </option>

        <option value="Music">
            Music
        </option>

        <option value="Artwork">
            Artwork
        </option>

        <option value="Manga">
            Manga
        </option>

    </select>

</section>


<section
    id="projects"
    class="projects"
>

    <div class="loading">
        Loading anime...
    </div>

</section>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

<script src="js/projects.js"></script>


</body>

</html>
```
