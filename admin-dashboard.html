<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard | Vidlyra</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #070707;
            color: #fff;
        }

        header {
            padding: 20px 30px;
            border-bottom: 1px solid #252525;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #ff7a00;
            font-size: 25px;
            font-weight: 700;
        }

        .admin-label {
            color: #aaa;
            font-size: 14px;
        }

        .container {
            width: min(1200px, 94%);
            margin: 30px auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .stat {
            background: #111;
            border: 1px solid #292929;
            border-radius: 14px;
            padding: 22px;
        }

        .stat-title {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: 700;
        }

        .projects {
            display: grid;
            gap: 18px;
        }

        .project-card {
            background: #111;
            border: 1px solid #292929;
            border-radius: 16px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 220px 1fr;
        }

        .thumbnail {
            width: 100%;
            height: 100%;
            min-height: 190px;
            object-fit: cover;
            background: #181818;
        }

        .project-info {
            padding: 22px;
        }

        .project-info h3 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .description {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .badge {
            padding: 6px 10px;
            background: #202020;
            border-radius: 20px;
            color: #ccc;
            font-size: 12px;
        }

        .pending {
            color: #ffb15c;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: 600;
        }

        .view {
            background: #242424;
            color: white;
        }

        .approve {
            background: #16834b;
            color: white;
        }

        .reject {
            background: #9b2929;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        #loading,
        #empty,
        #error {
            text-align: center;
            padding: 40px;
        }

        #empty {
            color: #888;
            display: none;
        }

        #error {
            color: #ff6464;
            display: none;
        }

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .project-card {
                grid-template-columns: 1fr;
            }

            .thumbnail {
                height: 200px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        VIDLYRA
    </div>

    <div class="admin-label">
        🛡️ Admin Dashboard
    </div>

</header>


<main class="container">

    <h1>
        Project Approval
    </h1>

    <p class="subtitle">
        Review and manage creator submissions.
    </p>


    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat">

            <div class="stat-title">
                Pending
            </div>

            <div
                class="stat-number"
                id="pendingCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Approved
            </div>

            <div
                class="stat-number"
                id="approvedCount"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Rejected
            </div>

            <div
                class="stat-number"
                id="rejectedCount"
            >
                0
            </div>

        </div>

    </section>


    <div id="loading">
        Loading projects...
    </div>


    <div id="error"></div>


    <div
        id="empty"
    >
        🎉 No pending projects.
    </div>


    <section
        class="projects"
        id="projects"
    ></section>


</main>


<!-- SUPABASE -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- YOUR CONFIG -->

<script src="js/config.js"></script>


<!-- ADMIN DASHBOARD -->

<script src="js/admin-dashboard.js"></script>


</body>

</html>
