<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | Vidlyra Creator Portal</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .signup-card {
            width: 100%;
            max-width: 450px;
            background: #111;
            border: 1px solid #252525;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 0 30px rgba(255, 122, 0, 0.15);
        }

        .logo {
            text-align: center;
            color: #ff7a00;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-top: 5px;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            color: #ccc;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff7a00;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            user-select: none;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            background: #ff7a00;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #ff9500;
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }

        .login-link a {
            color: #ff7a00;
            text-decoration: none;
            font-weight: 600;
        }

    </style>

</head>

<body>

    <div class="signup-card">

        <div class="logo">
            VIDLYRA
        </div>

        <p class="subtitle">
            Create Your Creator Account
        </p>


        <form id="signupForm">


            <div class="field">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <span
                        class="toggle"
                        id="togglePassword"
                    >
                        👁
                    </span>

                </div>

            </div>


            <div class="field">

                <label for="confirm">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="signup-btn"
                id="signupButton"
            >
                Create Account
            </button>


        </form>


        <div
            class="message"
            id="message"
        ></div>


        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration -->

    <script src="js/config.js"></script>


    <script>

        const form =
            document.getElementById("signupForm");

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("signupButton");


        // Password visibility

        document
            .getElementById("togglePassword")
            .addEventListener("click", function () {

                const password =
                    document.getElementById("password");

                if (password.type === "password") {

                    password.type = "text";
                    this.textContent = "🙈";

                } else {

                    password.type = "password";
                    this.textContent = "👁";

                }

            });


        // Signup

        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const name =
                document.getElementById("name")
                    .value
                    .trim();

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;

            const confirm =
                document.getElementById("confirm")
                    .value;


            message.textContent = "";
            message.style.color = "#ff5555";


            if (password !== confirm) {

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            button.disabled = true;
            button.textContent = "Creating Account...";


            try {

                const {
                    data,
                    error
                } = await sb.auth.signUp({

                    email: email,
                    password: password,

                    options: {
                        data: {
                            full_name: name
                        }
                    }

                });


                if (error) {

                    console.error(error);

                    message.textContent =
                        error.message;

                    return;
                }


                console.log(
                    "Signup response:",
                    data
                );


                // If email confirmation is enabled

                if (data.session === null) {

                    message.style.color =
                        "#55dd77";

                    message.textContent =
                        "Account created! Please check your email to confirm your account.";

                    return;
                }


                // Logged in immediately

                message.style.color =
                    "#55dd77";

                message.textContent =
                    "Account created successfully!";


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 700);


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to create your account.";

            } finally {

                button.disabled = false;

                button.textContent =
                    "Create Account";

            }

        });

    </script>

</body>

</html>
