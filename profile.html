<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Creator Profile | Vidlyra</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #070707;
            color: #fff;
        }

        header {
            height: 70px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #242424;
            background: #090909;
        }

        .logo {
            color: #ff7a00;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .back-btn {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .back-btn:hover {
            color: #ff7a00;
        }

        .profile-hero {
            width: min(1100px, 94%);
            margin: 40px auto 30px;
            padding: 35px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 20px;
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            background: #1c1c1c;
            border: 3px solid #ff7a00;
        }

        .avatar-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #1c1c1c;
            border: 3px solid #ff7a00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .creator-info {
            flex: 1;
        }

        .creator-name {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .rank {
            color: #ff9b45;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat strong {
            display: block;
            font-size: 24px;
        }

        .stat span {
            color: #777;
            font-size: 12px;
        }

        .level {
            display: inline-block;
            margin-top: 18px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #21170f;
            color: #ff9b45;
            font-size: 13px;
        }

        .content {
            width: min(1100px, 94%);
            margin: auto;
        }

        .section-title {
            font-size: 24px;
            margin: 30px 0 18px;
        }

        .projects {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        .project-card {
            background: #111;
            border: 1px solid #292929;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .project-card:hover {
            transform: translateY(-4px);
        }

        .project-image {
            width: 100%;
            height: 145px;
            object-fit: cover;
            background: #1a1a1a;
        }

        .project-content {
            padding: 15px;
        }

        .project-title {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .project-category {
            color: #ff8a24;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .project-date {
            color: #666;
            font-size: 11px;
        }

        .empty {
            padding: 50px;
            text-align: center;
            color: #777;
            background: #111;
            border: 1px solid #242424;
            border-radius: 15px;
        }

        .loading {
            padding: 50px;
            text-align: center;
            color: #888;
        }

        .error {
            padding: 30px;
            text-align: center;
            color: #ff6262;
        }

        @media (max-width: 650px) {

            .profile-hero {
                flex-direction: column;
                text-align: center;
            }

            .creator-name {
                font-size: 25px;
            }

            .stats {
                justify-content: center;
            }

            header {
                padding: 0 18px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        VIDLYRA
    </div>

    <a
        href="javascript:history.back()"
        class="back-btn"
    >
        ← Back
    </a>

</header>


<main>


    <!-- CREATOR PROFILE -->

    <section
        class="profile-hero"
        id="profileHero"
    >

        <div class="avatar-placeholder">
            👤
        </div>

        <div class="creator-info">

            <h1 class="creator-name">
                Loading Creator...
            </h1>

            <div class="rank">
                Loading rank...
            </div>

            <div class="stats">

                <div class="stat">

                    <strong>
                        0
                    </strong>

                    <span>
                        APPROVED PROJECTS
                    </span>

                </div>

                <div class="stat">

                    <strong>
                        1
                    </strong>

                    <span>
                        LEVEL
                    </span>

                </div>

            </div>

            <div class="level">
                Creator
            </div>

        </div>

    </section>


    <!-- PROJECTS -->

    <section class="content">

        <h2 class="section-title">
            Approved Projects
        </h2>

        <div
            id="projects"
            class="projects"
        >

            <div class="loading">
                Loading projects...
            </div>

        </div>

    </section>


</main>


<!-- SUPABASE -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- EXISTING CONFIG -->

<script src="js/config.js"></script>


<!-- PROFILE JS -->

<script src="js/profile.js"></script>


</body>

</html>
