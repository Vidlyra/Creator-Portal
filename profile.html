<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Creator Profile | Vidlyra</title>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
}


/* HEADER */

header {
    height: 70px;
    padding: 0 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: #111;
    border-bottom: 1px solid #252525;
}

.logo {
    color: #ff7a00;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 1px;
}

.back-btn {
    padding: 9px 16px;

    background: transparent;
    border: 1px solid #333;
    border-radius: 8px;

    color: #ccc;
    cursor: pointer;
}

.back-btn:hover {
    border-color: #ff7a00;
    color: #ff7a00;
}


/* CONTAINER */

.container {
    width: 100%;
    max-width: 700px;

    margin: 45px auto;
    padding: 0 20px;
}


/* PROFILE CARD */

.profile-card {
    background: #111;

    border: 1px solid #252525;
    border-radius: 18px;

    padding: 35px;

    box-shadow:
        0 0 30px rgba(255,122,0,.10);
}


/* LOADING */

.loading {
    text-align: center;
    color: #888;
    padding: 50px;
}


/* ERROR */

.error {
    display: none;

    padding: 20px;

    text-align: center;

    color: #ff5555;
}


/* AVATAR */

.avatar-section {
    text-align: center;
}

.avatar-image {
    width: 140px;
    height: 140px;

    border-radius: 50%;

    object-fit: cover;

    background: #1a1a1a;

    border: 3px solid #ff7a00;

    box-shadow:
        0 0 25px rgba(255,122,0,.20);
}

.creator-name {
    margin-top: 15px;

    font-size: 25px;
    font-weight: 600;
}

.creator-email {
    margin-top: 4px;

    color: #888;
    font-size: 14px;
}

.avatar-number {
    margin-top: 8px;

    color: #ff7a00;
    font-size: 13px;
}


/* LEVEL CARD */

.creator-level-card {
    margin-top: 30px;

    padding: 22px;

    background: #0d0d0d;

    border: 1px solid #292929;

    border-radius: 15px;
}

.level-header {
    display: flex;

    justify-content: space-between;
    align-items: center;
}

.level-label {
    color: #777;

    font-size: 11px;

    letter-spacing: 1px;
}

.creator-rank {
    margin-top: 4px;

    color: #ff7a00;

    font-size: 20px;

    font-weight: 600;
}

.creator-level {
    font-size: 18px;

    font-weight: 700;
}


/* PROGRESS */

.progress-info {
    display: flex;

    justify-content: space-between;

    margin-top: 20px;

    color: #aaa;

    font-size: 13px;
}

.progress-bar {
    width: 100%;

    height: 9px;

    margin-top: 8px;

    background: #252525;

    border-radius: 20px;

    overflow: hidden;
}

.progress-fill {
    width: 0%;

    height: 100%;

    background: #ff7a00;

    border-radius: 20px;

    transition: width .5s ease;
}

.next-level {
    margin-top: 9px;

    color: #777;

    font-size: 12px;
}


/* INFO */

.info-section {
    margin-top: 30px;
}

.info-row {
    display: flex;

    justify-content: space-between;

    gap: 15px;

    padding: 14px 0;

    border-bottom: 1px solid #222;
}

.info-label {
    color: #777;

    font-size: 13px;
}

.info-value {
    color: #ddd;

    font-size: 13px;

    text-align: right;

    word-break: break-all;
}


/* BUTTONS */

.actions {
    margin-top: 30px;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}

.action-btn {
    display: flex;

    justify-content: center;
    align-items: center;

    padding: 13px;

    background: #191919;

    border: 1px solid #333;

    border-radius: 10px;

    color: #ddd;

    text-decoration: none;

    font-size: 14px;
}

.action-btn:hover {
    border-color: #ff7a00;

    color: #ff7a00;
}

.logout-btn {
    width: 100%;

    margin-top: 15px;

    padding: 13px;

    background: transparent;

    border: 1px solid #552222;

    border-radius: 10px;

    color: #ff6666;

    cursor: pointer;

    font-size: 14px;
}

.logout-btn:hover {
    background: #241010;

    border-color: #ff5555;
}


/* MOBILE */

@media(max-width:600px) {

    header {
        padding: 0 18px;
    }

    .container {
        margin-top: 25px;
    }

    .profile-card {
        padding: 25px;
    }

    .actions {
        grid-template-columns: 1fr;
    }

    .level-header {
        align-items: flex-start;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        VIDLYRA
    </div>

    <button
        type="button"
        class="back-btn"
        onclick="window.location.href='dashboard.html'"
    >
        ← Dashboard
    </button>

</header>


<main class="container">


    <div
        id="loading"
        class="loading"
    >
        Loading creator profile...
    </div>


    <div
        id="error"
        class="error"
    ></div>


    <div
        id="profileContent"
        class="profile-card"
        style="display:none;"
    >


        <!-- CREATOR AVATAR -->

        <div class="avatar-section">

            <img
                id="creatorAvatarImage"
                class="avatar-image"
                src="assets/creator-avatars/creator1.png"
                alt="Creator Avatar"
            >

            <div
                id="creatorName"
                class="creator-name"
            >
                Creator
            </div>

            <div
                id="creatorEmail"
                class="creator-email"
            >
                creator@email.com
            </div>

            <div
                id="avatarNumber"
                class="avatar-number"
            >
                Creator Avatar #1
            </div>

        </div>


        <!-- CREATOR LEVEL -->

        <div class="creator-level-card">

            <div class="level-header">

                <div>

                    <div class="level-label">
                        CREATOR LEVEL
                    </div>

                    <div
                        id="creatorRank"
                        class="creator-rank"
                    >
                        New Creator
                    </div>

                </div>

                <div
                    id="creatorLevel"
                    class="creator-level"
                >
                    LEVEL 1
                </div>

            </div>


            <div class="progress-info">

                <span>
                    Approved Projects
                </span>

                <span>

                    <span id="approvedProjects">
                        0
                    </span>

                    /

                    <span id="nextLevelTarget">
                        3
                    </span>

                </span>

            </div>


            <div class="progress-bar">

                <div
                    id="levelProgress"
                    class="progress-fill"
                ></div>

            </div>


            <div
                id="nextLevelText"
                class="next-level"
            >
                3 approved projects needed for the next level.
            </div>

        </div>


        <!-- ACCOUNT -->

        <div class="info-section">

            <div class="info-row">

                <span class="info-label">
                    User ID
                </span>

                <span
                    id="userId"
                    class="info-value"
                >
                    —
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Account Created
                </span>

                <span
                    id="createdAt"
                    class="info-value"
                >
                    —
                </span>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <a
                href="creator-avatars.html"
                class="action-btn"
            >
                🎨 Creator Avatars
            </a>

            <a
                href="avatars.html"
                class="action-btn"
            >
                ✨ Frequency Avatars
            </a>

            <a
                href="projects.html"
                class="action-btn"
            >
                📁 My Projects
            </a>

            <a
                href="upload.html"
                class="action-btn"
            >
                ⬆️ Upload Project
            </a>

        </div>


        <button
            type="button"
            class="logout-btn"
            onclick="logout()"
        >
            🚪 Logout
        </button>


    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

<script src="js/profile.js"></script>


</body>

</html>
