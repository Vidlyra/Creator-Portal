<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Vidlyra</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #050505;

            color: white;

            padding: 20px;

        }


        .login-card {

            width: 100%;

            max-width: 420px;

            padding: 35px;

            background: #111;

            border: 1px solid #292929;

            border-radius: 18px;

            box-shadow:
                0 0 35px
                rgba(255, 122, 0, 0.10);

        }


        .logo {

            text-align: center;

            color: #ff7a00;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: 2px;

            margin-bottom: 8px;

        }


        h1 {

            text-align: center;

            font-size: 24px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 13px;

            margin-bottom: 30px;

        }


        .field {

            margin-bottom: 18px;

        }


        label {

            display: block;

            color: #ccc;

            font-size: 13px;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 14px;

            background: #1a1a1a;

            border: 1px solid #333;

            border-radius: 9px;

            color: white;

            outline: none;

            font-size: 14px;

        }


        input:focus {

            border-color: #ff7a00;

        }


        .login-btn {

            width: 100%;

            padding: 14px;

            margin-top: 8px;

            background: #ff7a00;

            border: none;

            border-radius: 9px;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

        }


        .login-btn:hover {

            background: #ff9500;

        }


        .login-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        #message {

            min-height: 24px;

            margin-top: 18px;

            text-align: center;

            color: #aaa;

            font-size: 13px;

        }


        .register-link {

            text-align: center;

            margin-top: 22px;

            color: #777;

            font-size: 13px;

        }


        .register-link a {

            color: #ff7a00;

            text-decoration: none;

        }


        .register-link a:hover {

            text-decoration: underline;

        }

    </style>

</head>


<body>


    <main class="login-card">


        <div class="logo">
            VIDLYRA
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="subtitle">
            Sign in to your Vidlyra account
        </p>


        <form
            id="loginForm"
            onsubmit="event.preventDefault(); loginUser();"
        >


            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <div
            id="message"
        ></div>


        <div class="register-link">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>


    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- SUPABASE CONFIG -->

    <script src="js/config.js"></script>


    <!-- AUTH -->

    <script src="js/auth.js"></script>


</body>

</html>
