<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Vidlyra Creator Portal</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #111;
            border: 1px solid #252525;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 0 30px rgba(255, 122, 0, 0.15);
        }

        .logo {
            text-align: center;
            color: #ff7a00;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            color: #ccc;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff7a00;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            user-select: none;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 13px;
            color: #999;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .options a,
        .signup a {
            color: #ff7a00;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: #ff7a00;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }

        .login-btn:hover {
            background: #ff9500;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #ff5555;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }

        .loading {
            display: none;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 25px;
            }

            .logo {
                font-size: 29px;
            }

        }

    </style>

</head>

<body>

    <div class="login-card">

        <div class="logo">
            VIDLYRA
        </div>

        <p class="subtitle">
            Creator Portal Login
        </p>

        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <span
                        class="toggle-password"
                        id="togglePassword"
                    >
                        👁
                    </span>

                </div>

            </div>

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember Me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >

                Login

                <span
                    class="loading"
                    id="loading"
                >
                    ...
                </span>

            </button>

        </form>

        <div
            class="message"
            id="message"
        ></div>

        <div class="signup">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>

    </div>


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase Configuration -->

    <script src="js/config.js"></script>


    <!-- Authentication -->

    <script src="js/auth.js"></script>


    <script>

        // Password visibility

        document
            .getElementById("togglePassword")
            .addEventListener("click", function () {

                const password =
                    document.getElementById("password");

                if (password.type === "password") {

                    password.type = "text";
                    this.textContent = "🙈";

                } else {

                    password.type = "password";
                    this.textContent = "👁";

                }

            });


        // Login form

        document
            .getElementById("loginForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                login();

            });

    </script>

</body>

</html>
